---
# Continuous integration: format check, static analysis, tests, and a release-build smoke check.

# The release workflow (release.yml) builds and publishes the binaries on every push.
# This workflow is the fast feedback loop run on pushes and pull requests: it keeps the code
# formatted, clippy-clean, and passing tests on the supported platforms.

# Linux tests run natively on the `x86_64-unknown-linux-gnu` host and through cross-rs on
# `x86_64-unknown-linux-musl` so the required static-linked target is exercised end to end.
# The macOS targets build and test natively on their own runners — never cross-compiled from Linux.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    # Format and static analysis are host-independent, so run them once.
    name: fmt & clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cache
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test-linux:
    name: test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The host target runs natively: fastest path to unit + integration tests.
          - target: x86_64-unknown-linux-gnu
            cross: false
          # The required musl target runs through cross so it is tested, not just compiled.
          - target: x86_64-unknown-linux-musl
            cross: true
    steps:
      - uses: actions/checkout@v7

      - name: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross
        if: ${{ matrix.cross }}
        # The pre-built cross binary rather than `cargo install cross`, which spends ~5 min
        # compiling a tool the job uses once.
        run: |
          mkdir -p "$HOME/.cargo/bin"
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xzf - -C "$HOME/.cargo/bin"
          echo "CARGO=cross" >> "$GITHUB_ENV"

      - name: cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: cargo test
        run: ${{ matrix.cross && 'cross' || 'cargo' }} test --locked --target ${{ matrix.target }}

      - name: cargo build (release smoke check)
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --locked --target ${{ matrix.target }}

  test-macos:
    name: test (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-26-intel
          - target: aarch64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: cargo test
        run: cargo test --locked --target ${{ matrix.target }}

      - name: cargo build (release smoke check)
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: actionlint-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/actionlint
